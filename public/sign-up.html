<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
<form class="signup-form">
    <p class="signup-title">Register</p>
    <p class="signup-message">Signup to use the Todo App!</p>

    <div class="signup-flex">
        <label>
            <input class="signup-input" type="text" placeholder="" required>
            <span>Username</span>
        </label>

       
    </div>

    <label>
        <input class="signup-input" type="email" placeholder="" required>
        <span>Email</span>
    </label>

    <label>
        <input class="signup-input" type="password" placeholder="" required>
        <span>Password</span>
    </label>

   

    <button class="signup-submit">Sign Up</button>

    <p class="signup-signin">
        Already have an account? <a href="#">Sign In</a>
    </p>
</form>
    
</body>
</html>

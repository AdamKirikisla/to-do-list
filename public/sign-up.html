<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">

</head>
<body>
<form class="signup-form">
    <p class="signup-title">Register</p>
    <p class="signup-message">Signup to use the Todo App!</p>

    <div class="signup-flex">
        <label>
            <input class="signup-input" type="text" placeholder="" name="username" required
            pattern="^[a-zA-Z0-9_\-]{1,20}$"
            title="Username must be 1–20 characters and can only include letters, numbers, underscores (_), or hyphens (-).">
            <span>Username</span>
        </label>

       
    </div>

    <label>
        <input class="signup-input" type="email" placeholder="" name="email" required
        pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
        title="Enter a valid email address, like name@example.com">
        <span>Email</span>
    </label>

    <label>
        <input class="signup-input" type="password" placeholder=""  name="password" required
        pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$"
        title="Password must be at least 8 characters and include at least one letter and one number.">
        <span>Password</span>
    </label>

   
    <p class="signup-error"></p>
    <button class="signup-submit" type="submit">Sign Up</button>

    <p class="signup-signin">
        Already have an account? <a href="log-in.html">Sign In</a>
    </p>
</form>
    <script type="module" src="js/sign-up.js"></script>
</body>
</html>

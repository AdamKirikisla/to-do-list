<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body class="login-page">

    <form class="login-form">

        <p class="login-title">Welcome Back</p>

        <p class="login-message">
            Login to continue using the Todo App!
        </p>

        <label>
            <input class="login-input" type="email" placeholder="" name="email" required>
            <span>Email</span>
        </label>

        <label>
            <input class="login-input" type="password" placeholder="" name="password" required>
            <span>Password</span>
        </label>

        <p class="login-error"></p>

        <button class="login-submit" type="submit">
            Login
        </button>

        <p class="login-signup">
            Don't have an account?
            <a href="sign-up.html">Sign Up</a>
        </p>

    </form>
<script type="module" src="js/log-in.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>
<body>

    <header>
        <h1>TODO APP</h1>
        <p class="stats">7 open · 3 done</p>
    </header>
    
    <main>
        <!-- Forms -->
         <section aria-label="Add task">
            <form action="" id="add-task-form">
                <input type="text" name="task" placeholder="Add a task!" required>
                <button type="submit">ADD</button>
            </form>
         </section>

            <!-- Filters -->
        <section aria-label="Filters" id="filters-form">
            <div class="visually-hidden">
                <label>
            <p>Priority</p>
            <select name="priority">
                <option value="all">All priorities</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>
                </label>
            </div>
            

            <div class="visually-hidden">
                <label>
            <p>Status</p>
            <select name="status">
                <option value="all">All tasks</option>
                <option value="open">Open</option>
                <option value="done">Done</option>
            </select>
                </label>
            </div>
            

            <div class="visually-hidden">
                <label>
            <p>Category</p>
            <select name="category">
                <option value="all">All categories</option>
                <option value="work">Work</option>
                <option value="personal">Personal</option>
                <option value="errands">Errands</option>
            </select>
                </label>
            </div>
        </section>


          <!-- Task list -->
        <section aria-label="Tasks">
        <ul id="task-list">
            <li class="task" data-id="1">
            <input type="checkbox" class="task-check">
            <div class="task-info">
                <p class="task-title">Send client follow-up</p>
                <p class="task-meta">Work · Aug 18 · High</p>
            </div>
            <div class="task-actions">
                <button class="edit-btn" aria-label="Edit task">✏️</button>
                <button class="delete-btn" aria-label="Delete task">🗑️</button>
            </div>
            </li>


            <!-- more <li class="task"> items -->
                <li class="task" data-id="2">
            <input type="checkbox" class="task-check">
            <div class="task-info">
                <p class="task-title">Study</p>
                <p class="task-meta">Study · Sept 18 · High</p>
            </div>
            <div class="task-actions">
                <button class="edit-btn" aria-label="Edit task">✏️</button>
                <button class="delete-btn" aria-label="Delete task">🗑️</button>
            </div>
            </li>
        </ul>
        </section>


    </main>
</body>
</html>
